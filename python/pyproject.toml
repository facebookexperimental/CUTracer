[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cutracer"
dynamic = ["version"]
description = "Python tools for CUTracer trace validation and analysis"
requires-python = ">=3.10"
authors = [
    {name = "Yueming Hao", email = "yhao@meta.com"}
]
readme = "README.md"
license = "MIT"

# Canonical dependency list: requirements.txt mirrors [project.dependencies]
# and [project.optional-dependencies] below (flattened into one file).
# When updating any dependency in either file, update the other in the same
# change; if the two disagree, this file wins. [build-system] requires are
# build-only and are intentionally not mirrored in requirements.txt.
dependencies = [
    "click>=8.0.0",
    "jsonschema>=4.0.0",
    "zstandard>=0.20.0",
    "tabulate>=0.9.0",
    "importlib_resources>=5.0.0; python_version < '3.11'",
    "tritonparse>=0.4.3",
]

[project.optional-dependencies]
# Must stay optional: yscope_clp_core ships only x86_64 wheels (no sdist), so
# requiring it breaks `pip install cutracer` on aarch64 (e.g. GB200/GB300).
# The platform_machine marker keeps the clp extra a no-op off x86_64,
# matching requirements.txt; querying a .clp archive there reports that
# yscope_clp_core is unavailable.
clp = [
    "yscope_clp_core>=0.7.1b2; platform_machine == 'x86_64'",
]
dev = [
    "mypy>=1.0.0",
    "ufmt==2.9.0",
    "usort==1.1.0",
    "ruff-api==0.2.0",
    "ruff>=0.4.0",
]

[project.urls]
"Homepage" = "https://github.com/facebookexperimental/CUTracer"
"Bug Tracker" = "https://github.com/facebookexperimental/CUTracer/issues"

[project.scripts]
cutracer = "cutracer.cli:main"

[tool.setuptools.packages.find]
include = ["cutracer*"]
exclude = ["cutracer.fb", "cutracer.fb.*", "cutracer.*.fb", "cutracer.*.fb.*"]

[tool.setuptools.package-data]
"cutracer.validation.schemas" = ["*.json"]

[tool.ufmt]
formatter = "ruff-api"
sorter = "usort"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.usort]
first_party_detection = false

[tool.setuptools_scm]
root = ".."
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
